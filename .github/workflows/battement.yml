name: Battement Supabase
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  battement:
    runs-on: ubuntu-latest
    steps:
      - name: Écrire la date dans la table battement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          curl --fail --silent --show-error -X POST "$SUPABASE_URL/rest/v1/battement" \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": 1, \"le\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
